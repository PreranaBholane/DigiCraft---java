<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Change Password</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-image: url('https://i.pinimg.com/originals/84/aa/28/84aa2884cfb2e3bb81c68e1608f1b688.jpg'); /* Tribal style or art theme */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: 'Segoe UI', sans-serif;
        }

        .overlay {
            background-color: rgba(255, 255, 255, 0.94);
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .form-box {
            background-color: #fffef3;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            width: 350px;
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
            color: #333;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            margin: 12px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
        }

        input[type="submit"] {
            background-color: #8B4000; /* Reddish brown */
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 15px;
            width: 100%;
        }

        input[type="submit"]:hover {
            background-color: #6f2f00;
        }

        .back-link {
            margin-top: 20px;
            display: block;
            font-size: 14px;
            text-decoration: none;
            color: #444;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="overlay">
        <div class="form-box">
            <h2>Change Password</h2>
            <form action="ChangePassword" method="post">
                <input type="text" name="username" placeholder="Enter Username" required>
                <input type="password" name="oldPassword" placeholder="Enter Old Password" required>
                <input type="password" name="newPassword" placeholder="Enter New Password" required>
                <input type="submit" value="Change Password">
            </form>
            
        </div>
    </div>
</body>
</html>
