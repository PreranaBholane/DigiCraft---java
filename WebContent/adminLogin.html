<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login - DigiCraft</title>
    <style>
      /* Reset and Base Styles */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        line-height: 1.5;
        color: #4a3f35;
        overflow-x: hidden;
      }

      /* Color Variables */
      :root {
        --saffron-50: #fef7ec;
        --saffron-100: #fdefd3;
        --saffron-200: #facaa5;
        --saffron-300: #f7a06d;
        --saffron-400: #f37332;
        --saffron-500: #f0540a;
        --saffron-600: #e13e00;
        --saffron-700: #bb2f02;
        --saffron-900: #7a220b;

        --terracotta-50: #fef5f0;
        --terracotta-100: #fce8de;
        --terracotta-200: #f8cfbd;
        --terracotta-400: #ea7d57;
        --terracotta-500: #e25a2e;
        --terracotta-600: #d44220;
        --terracotta-800: #8f2b1c;
        --terracotta-900: #74261b;

        --marigold-50: #fffaeb;
        --marigold-100: #fef3c7;
        --marigold-200: #fde68a;
        --marigold-300: #fcd34d;
        --marigold-400: #fbbf24;
        --marigold-500: #f59e0b;

        --earthen-50: #f7f3f0;
        --earthen-600: #724730;
        --earthen-700: #5d3a28;
        --earthen-800: #4d3024;
        --earthen-900: #422921;

        --white-95: rgba(255, 255, 255, 0.95);
      }

      /* Animations */
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes fadeInLeft {
        from {
          opacity: 0;
          transform: translateX(-30px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-10px);
        }
      }

      @keyframes pulseGlow {
        0%,
        100% {
          box-shadow: 0 0 5px rgba(240, 84, 10, 0.4);
        }
        50% {
          box-shadow: 0 0 20px rgba(240, 84, 10, 0.8);
        }
      }

      @keyframes ping {
        75%,
        100% {
          transform: scale(2);
          opacity: 0;
        }
      }

      @keyframes shimmer {
        0% {
          background-position: -200px 0;
        }
        100% {
          background-position: calc(200px + 100%) 0;
        }
      }

      /* Main Layout */
      .main-container {
        min-height: 100vh;
        position: relative;
        overflow: hidden;
      }

      .background {
        position: absolute;
        inset: 0;
        background-image: url("https://images.pexels.com/photos/8066077/pexels-photo-8066077.jpeg");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
      }

      .background-overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          135deg,
          rgba(122, 34, 11, 0.85) 0%,
          rgba(240, 84, 10, 0.75) 50%,
          rgba(66, 41, 33, 0.85) 100%
        );
      }

      /* Decorative Elements */
      .decorative-circle {
        position: absolute;
        border: 4px solid;
        border-radius: 50%;
      }

      .circle-1 {
        top: 40px;
        left: 40px;
        width: 100px;
        height: 100px;
        border-color: rgba(251, 191, 36, 0.4);
        animation: pulseGlow 2s ease-in-out infinite;
      }

      .circle-2 {
        bottom: 60px;
        right: 50px;
        width: 80px;
        height: 80px;
        border-color: rgba(240, 84, 10, 0.5);
        animation: float 3s ease-in-out infinite;
      }

      .circle-3 {
        top: 20%;
        right: 15%;
        width: 60px;
        height: 60px;
        background-color: rgba(226, 90, 46, 0.3);
        border: none;
        animation: ping 2s cubic-bezier(0, 0, 0.2, 1) infinite;
      }

      /* Content Layout */
      .content-wrapper {
        position: relative;
        z-index: 10;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .content-container {
        width: 100%;
        max-width: 420px;
      }

      /* Header */
      .header {
        text-align: center;
        margin-bottom: 32px;
        animation: fadeInUp 0.8s ease-out;
      }

      .logo-container {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 70px;
        height: 70px;
        background: linear-gradient(
          135deg,
          var(--saffron-500),
          var(--terracotta-600)
        );
        border-radius: 50%;
        margin-bottom: 16px;
        box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.3);
        animation: pulseGlow 2s ease-in-out infinite;
      }

      .logo-icon {
        width: 35px;
        height: 35px;
        color: white;
      }

      .main-title {
        font-size: 2rem;
        font-weight: 700;
        color: white;
        margin-bottom: 8px;
        letter-spacing: -0.025em;
      }

      .gradient-text {
        background: linear-gradient(
          90deg,
          var(--marigold-300),
          var(--saffron-200)
        );
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
      }

      .subtitle {
        font-size: 1.1rem;
        color: var(--marigold-200);
        font-weight: 500;
      }

      /* Login Card */
      .login-card {
        background-color: var(--white-95);
        backdrop-filter: blur(8px);
        border-radius: 16px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        animation: fadeInUp 0.8s ease-out 0.2s both;
        overflow: hidden;
      }

      .card-header {
        text-align: center;
        padding: 32px 24px 24px;
        background: linear-gradient(
          135deg,
          var(--saffron-50),
          var(--terracotta-50)
        );
        border-bottom: 2px solid var(--saffron-200);
      }

      .card-title {
        font-size: 1.75rem;
        font-weight: 700;
        color: var(--earthen-800);
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
      }

      .admin-icon {
        width: 32px;
        height: 32px;
        padding: 6px;
        background-color: var(--saffron-500);
        border-radius: 8px;
        color: white;
      }

      .card-description {
        color: var(--earthen-600);
        font-size: 0.95rem;
      }

      /* Form Styles */
      .form-container {
        padding: 32px;
      }

      .form-group {
        margin-bottom: 24px;
        animation: fadeInLeft 0.6s ease-out;
      }

      .form-group:nth-child(2) {
        animation-delay: 0.1s;
      }

      .form-group:nth-child(3) {
        animation-delay: 0.2s;
      }

      .form-label {
        display: block;
        font-weight: 600;
        color: var(--earthen-700);
        margin-bottom: 8px;
        font-size: 0.95rem;
        text-transform: capitalize;
      }

      .form-input {
        width: 100%;
        padding: 14px 16px;
        border: 2px solid var(--saffron-200);
        border-radius: 10px;
        font-size: 1rem;
        background-color: var(--saffron-50);
        transition: all 0.3s ease;
        color: var(--earthen-800);
      }

      .form-input:focus {
        outline: none;
        border-color: var(--saffron-500);
        background-color: white;
        box-shadow: 0 0 0 3px rgba(240, 84, 10, 0.1);
        transform: translateY(-1px);
      }

      .form-input::placeholder {
        color: var(--earthen-600);
        opacity: 0.7;
      }

      /* Submit Button */
      .submit-button {
        width: 100%;
        padding: 16px;
        background: linear-gradient(
          135deg,
          var(--saffron-500),
          var(--terracotta-600)
        );
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 1.1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
        animation: fadeInUp 0.6s ease-out 0.3s both;
      }

      .submit-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px -5px rgba(240, 84, 10, 0.4);
        background: linear-gradient(
          135deg,
          var(--saffron-600),
          var(--terracotta-700)
        );
      }

      .submit-button:active {
        transform: translateY(0);
      }

      .submit-button::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.2),
          transparent
        );
        transition: left 0.5s;
      }

      .submit-button:hover::before {
        left: 100%;
      }

      /* Back to Home Link */
      .back-link {
        text-align: center;
        margin-top: 24px;
        animation: fadeInUp 0.6s ease-out 0.4s both;
      }

      .back-link a {
        color: var(--marigold-100);
        text-decoration: none;
        font-weight: 500;
        transition: all 0.3s ease;
        padding: 8px 16px;
        border-radius: 6px;
        display: inline-block;
      }

      .back-link a:hover {
        color: var(--marigold-200);
        background-color: rgba(255, 255, 255, 0.1);
        transform: translateY(-1px);
      }

      /* Responsive Design */
      @media (max-width: 640px) {
        .content-wrapper {
          padding: 16px;
        }

        .main-title {
          font-size: 1.75rem;
        }

        .subtitle {
          font-size: 1rem;
        }

        .form-container {
          padding: 24px;
        }

        .card-header {
          padding: 24px 16px 16px;
        }

        .circle-1 {
          width: 60px;
          height: 60px;
          top: 20px;
          left: 20px;
        }

        .circle-2 {
          width: 50px;
          height: 50px;
          bottom: 30px;
          right: 30px;
        }

        .circle-3 {
          width: 40px;
          height: 40px;
        }
      }

      /* Loading State */
      .loading {
        opacity: 0.7;
        pointer-events: none;
      }

      .loading .submit-button {
        background: linear-gradient(
          135deg,
          var(--earthen-600),
          var(--earthen-700)
        );
      }
    </style>
  </head>
  <body>
    <div class="main-container">
      <!-- Background Image with Overlay -->
      <div class="background">
        <div class="background-overlay"></div>
      </div>

      <!-- Decorative Elements -->
      <div class="decorative-circle circle-1"></div>
      <div class="decorative-circle circle-2"></div>
      <div class="decorative-circle circle-3"></div>

      <!-- Main Content -->
      <div class="content-wrapper">
        <div class="content-container">
          <!-- Header -->
          <div class="header">
            <div class="logo-container">
              <svg class="logo-icon" fill="currentColor" viewBox="0 0 24 24">
                <path
                  d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"
                />
              </svg>
            </div>
            <h1 class="main-title">
              <span class="gradient-text">DigiCraft</span>
            </h1>
            <p class="subtitle">Admin Portal</p>
          </div>

          <!-- Login Card -->
          <div class="login-card">
            <div class="card-header">
              <h2 class="card-title">
                <svg class="admin-icon" fill="currentColor" viewBox="0 0 24 24">
                  <path
                    d="M12 2C13.1 2 14 2.9 14 4C14 5.1 13.1 6 12 6C10.9 6 10 5.1 10 4C10 2.9 10.9 2 12 2ZM21 9V7L15 4V6L21 9ZM15 18V20L21 17V15L15 18ZM3 7V9L9 6V4L3 7ZM9 20V18L3 15V17L9 20Z"
                  />
                </svg>
                Admin Login
              </h2>
              <p class="card-description">
                Secure access to marketplace management
              </p>
            </div>

            <div class="form-container">
              <form action="AdminLogin" method="post">
                <div class="form-group">
                  <label class="form-label" for="email">Email Address</label>
                  <input
                    type="email"
                    id="email"
                    name="email"
                    class="form-input"
                    placeholder="Enter your admin email"
                    required
                  />
                </div>

                <div class="form-group">
                  <label class="form-label" for="password">Password</label>
                  <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-input"
                    placeholder="Enter your secure password"
                    required
                  />
                </div>

                <button type="submit" class="submit-button">
                  Access Admin Panel
                </button>
              </form>
            </div>
          </div>

          <!-- Back to Home Link -->
          <div class="back-link">
            <a href="index.html">← Back to Home</a>
          </div>
        </div>
      </div>
    </div>

    <script>
      // Add some interactive functionality
      document.addEventListener("DOMContentLoaded", function () {
        const form = document.querySelector("form");
        const submitButton = document.querySelector(".submit-button");
        const inputs = document.querySelectorAll(".form-input");

        // Add focus animations to inputs
        inputs.forEach((input) => {
          input.addEventListener("focus", function () {
            this.parentElement.style.transform = "translateX(4px)";
          });

          input.addEventListener("blur", function () {
            this.parentElement.style.transform = "translateX(0)";
          });
        });

        // Handle form submission
        form.addEventListener("submit", function (e) {
          // Add loading state
          submitButton.textContent = "Authenticating...";
          document.body.classList.add("loading");

          // You can remove this preventDefault to allow actual form submission
          // e.preventDefault();
        });
      });
    </script>
  </body>
</html>
