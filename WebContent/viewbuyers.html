<!DOCTYPE html>
<html>
<head>
    <meta charset="ISO-8859-1">
    <title>Admin - View Options</title>
    <style>
        body {
            background-color: #8b5e3c; /* Brown background */
            font-family: Arial, sans-serif;
            color: #fff;
            margin: 0;
            padding: 40px;
        }

        h2 {
            text-align: center;
            color: #fff8f0;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .box {
            background-color: #fffaf0; /* Cream white box */
            width: 320px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 12px rgba(0,0,0,0.2);
            text-align: center;
        }

        a {
            display: block;
            margin: 15px 0;
            text-decoration: none;
            color: #4a3f35;
            font-size: 18px;
            font-weight: bold;
            background-color: #f5e4c3;
            padding: 12px;
            border-radius: 8px;
            transition: 0.3s ease;
        }

        a:hover {
            background-color: #eed9b6;
            color: #3a2c1b;
        }
    </style>
</head>
<body>

    <h2>Admin Dashboard</h2>

    <div class="box">
        <a href="viewArtisans.jsp">Artisan Approval</a>
        <a href="viewbuyers">View Buyers</a>
    </div>

</body>
</html>
