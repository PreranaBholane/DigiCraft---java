<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Error - DigiCraft</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #D4AF37; /* Golden brown background */
            font-family: 'Segoe UI', sans-serif;
            color: #333;
        }

        .overlay {
            background-color: rgba(255, 255, 255, 0.95);
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .error-box {
            text-align: center;
            background-color: #fffef0;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
            max-width: 400px;
        }

        .error-box h1 {
            font-size: 48px;
            margin-bottom: 10px;
            color: #C62828;
        }

        .error-box p {
            font-size: 18px;
            margin-bottom: 20px;
        }

        .error-box a {
            display: inline-block;
            padding: 10px 20px;
            background-color: #8B4000; /* Reddish-brown */
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        .error-box a:hover {
            background-color: #6e2f00;
        }
    </style>
</head>
<body>
    <div class="overlay">
        <div class="error-box">
            <h1>Oops!</h1>
            <p>An unexpected error occurred.<br>Please try again later.</p>
            <a href="artisan_login.html">← Back to Login</a>
        </div>
    </div>
</body>
</html>
