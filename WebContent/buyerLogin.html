<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buyer Login - DigiCraft</title>
    <style>
      /* Reset and Base Styles */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        line-height: 1.5;
        color: #4a3f35;
        overflow-x: hidden;
      }

      /* Color Variables */
      :root {
        --saffron-50: #fef7ec;
        --saffron-100: #fdefd3;
        --saffron-200: #facaa5;
        --saffron-300: #f7a06d;
        --saffron-400: #f37332;
        --saffron-500: #f0540a;
        --saffron-600: #e13e00;
        --saffron-700: #bb2f02;
        --saffron-900: #7a220b;

        --terracotta-50: #fef5f0;
        --terracotta-100: #fce8de;
        --terracotta-200: #f8cfbd;
        --terracotta-300: #f2ac8b;
        --terracotta-400: #ea7d57;
        --terracotta-500: #e25a2e;
        --terracotta-600: #d44220;
        --terracotta-700: #b1341b;
        --terracotta-800: #8f2b1c;
        --terracotta-900: #74261b;

        --marigold-50: #fffaeb;
        --marigold-100: #fef3c7;
        --marigold-200: #fde68a;
        --marigold-300: #fcd34d;
        --marigold-400: #fbbf24;
        --marigold-500: #f59e0b;
        --marigold-600: #d97706;
        --marigold-700: #b45309;
        --marigold-800: #92400e;

        --earthen-50: #f7f3f0;
        --earthen-600: #724730;
        --earthen-700: #5d3a28;
        --earthen-800: #4d3024;
        --earthen-900: #422921;

        --white-95: rgba(255, 255, 255, 0.95);
      }

      /* Animations */
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes fadeInLeft {
        from {
          opacity: 0;
          transform: translateX(-30px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-10px);
        }
      }

      @keyframes pulseGlow {
        0%,
        100% {
          box-shadow: 0 0 8px rgba(251, 191, 36, 0.5);
        }
        50% {
          box-shadow: 0 0 25px rgba(251, 191, 36, 0.8);
        }
      }

      @keyframes ping {
        75%,
        100% {
          transform: scale(2);
          opacity: 0;
        }
      }

      @keyframes bounce {
        0%,
        20%,
        53%,
        80%,
        100% {
          transform: translateY(0);
        }
        40%,
        43% {
          transform: translateY(-8px);
        }
        70% {
          transform: translateY(-4px);
        }
        90% {
          transform: translateY(-2px);
        }
      }

      /* Main Layout */
      .main-container {
        min-height: 100vh;
        position: relative;
        overflow: hidden;
      }

      .background {
        position: absolute;
        inset: 0;
        background-image: url("https://images.pexels.com/photos/1745747/pexels-photo-1745747.jpeg");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
      }

      .background-overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          135deg,
          rgba(180, 83, 9, 0.85) 0%,
          rgba(251, 191, 36, 0.75) 50%,
          rgba(66, 41, 33, 0.85) 100%
        );
      }

      /* Decorative Elements */
      .decorative-circle {
        position: absolute;
        border: 4px solid;
        border-radius: 50%;
      }

      .circle-1 {
        top: 60px;
        left: 50px;
        width: 85px;
        height: 85px;
        border-color: rgba(251, 191, 36, 0.5);
        animation: pulseGlow 2.2s ease-in-out infinite;
      }

      .circle-2 {
        bottom: 80px;
        right: 30px;
        width: 70px;
        height: 70px;
        border-color: rgba(252, 211, 77, 0.6);
        animation: float 3.2s ease-in-out infinite;
      }

      .circle-3 {
        top: 30%;
        right: 18%;
        width: 50px;
        height: 50px;
        background-color: rgba(253, 230, 138, 0.4);
        border: none;
        animation: ping 2.8s cubic-bezier(0, 0, 0.2, 1) infinite;
      }

      /* Content Layout */
      .content-wrapper {
        position: relative;
        z-index: 10;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .content-container {
        width: 100%;
        max-width: 420px;
      }

      /* Header */
      .header {
        text-align: center;
        margin-bottom: 32px;
        animation: fadeInUp 0.8s ease-out;
      }

      .logo-container {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 70px;
        height: 70px;
        background: linear-gradient(
          135deg,
          var(--marigold-500),
          var(--marigold-700)
        );
        border-radius: 50%;
        margin-bottom: 16px;
        box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.3);
        animation: pulseGlow 2s ease-in-out infinite;
      }

      .logo-icon {
        width: 35px;
        height: 35px;
        color: white;
      }

      .main-title {
        font-size: 2rem;
        font-weight: 700;
        color: white;
        margin-bottom: 8px;
        letter-spacing: -0.025em;
      }

      .gradient-text {
        background: linear-gradient(
          90deg,
          var(--marigold-200),
          var(--marigold-300)
        );
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
      }

      .subtitle {
        font-size: 1.1rem;
        color: var(--marigold-100);
        font-weight: 500;
      }

      /* Login Card */
      .login-card {
        background-color: var(--white-95);
        backdrop-filter: blur(8px);
        border-radius: 16px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        animation: fadeInUp 0.8s ease-out 0.2s both;
        overflow: hidden;
      }

      .card-header {
        text-align: center;
        padding: 32px 24px 24px;
        background: linear-gradient(
          135deg,
          var(--marigold-50),
          var(--marigold-100)
        );
        border-bottom: 2px solid var(--marigold-200);
      }

      .card-title {
        font-size: 1.75rem;
        font-weight: 700;
        color: var(--earthen-800);
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
      }

      .buyer-icon {
        width: 32px;
        height: 32px;
        padding: 6px;
        background-color: var(--marigold-500);
        border-radius: 8px;
        color: white;
        animation: bounce 2s ease-in-out infinite;
      }

      .card-description {
        color: var(--earthen-600);
        font-size: 0.95rem;
      }

      /* Form Styles */
      .form-container {
        padding: 32px;
      }

      .form-group {
        margin-bottom: 24px;
        animation: fadeInLeft 0.6s ease-out;
      }

      .form-group:nth-child(2) {
        animation-delay: 0.1s;
      }

      .form-group:nth-child(3) {
        animation-delay: 0.2s;
      }

      .form-label {
        display: block;
        font-weight: 600;
        color: var(--earthen-700);
        margin-bottom: 8px;
        font-size: 0.95rem;
        text-transform: capitalize;
      }

      .form-input {
        width: 100%;
        padding: 14px 16px;
        border: 2px solid var(--marigold-200);
        border-radius: 10px;
        font-size: 1rem;
        background-color: var(--marigold-50);
        transition: all 0.3s ease;
        color: var(--earthen-800);
      }

      .form-input:focus {
        outline: none;
        border-color: var(--marigold-500);
        background-color: white;
        box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.1);
        transform: translateY(-1px);
      }

      .form-input::placeholder {
        color: var(--earthen-600);
        opacity: 0.7;
      }

      /* Submit Button */
      .submit-button {
        width: 100%;
        padding: 16px;
        background: linear-gradient(
          135deg,
          var(--marigold-500),
          var(--marigold-700)
        );
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 1.1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
        animation: fadeInUp 0.6s ease-out 0.3s both;
        margin-bottom: 16px;
      }

      .submit-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px -5px rgba(251, 191, 36, 0.4);
        background: linear-gradient(
          135deg,
          var(--marigold-600),
          var(--marigold-800)
        );
      }

      .submit-button:active {
        transform: translateY(0);
      }

      .submit-button::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.2),
          transparent
        );
        transition: left 0.5s;
      }

      .submit-button:hover::before {
        left: 100%;
      }

      /* Register Link */
      .register-link {
        text-align: center;
        animation: fadeInUp 0.6s ease-out 0.4s both;
      }

      .register-link a {
        color: var(--marigold-600);
        text-decoration: none;
        font-weight: 600;
        padding: 12px 20px;
        border: 2px solid var(--marigold-300);
        border-radius: 8px;
        display: inline-block;
        transition: all 0.3s ease;
        background: linear-gradient(
          135deg,
          var(--marigold-50),
          var(--marigold-100)
        );
      }

      .register-link a:hover {
        background: linear-gradient(
          135deg,
          var(--marigold-500),
          var(--marigold-600)
        );
        color: white;
        border-color: var(--marigold-500);
        transform: translateY(-2px);
        box-shadow: 0 5px 15px -3px rgba(251, 191, 36, 0.3);
      }

      /* Back to Home Link */
      .back-link {
        text-align: center;
        margin-top: 24px;
        animation: fadeInUp 0.6s ease-out 0.5s both;
      }

      .back-link a {
        color: var(--marigold-100);
        text-decoration: none;
        font-weight: 500;
        transition: all 0.3s ease;
        padding: 8px 16px;
        border-radius: 6px;
        display: inline-block;
      }

      .back-link a:hover {
        color: var(--marigold-200);
        background-color: rgba(255, 255, 255, 0.1);
        transform: translateY(-1px);
      }

      /* Responsive Design */
      @media (max-width: 640px) {
        .content-wrapper {
          padding: 16px;
        }

        .main-title {
          font-size: 1.75rem;
        }

        .subtitle {
          font-size: 1rem;
        }

        .form-container {
          padding: 24px;
        }

        .card-header {
          padding: 24px 16px 16px;
        }

        .circle-1 {
          width: 60px;
          height: 60px;
          top: 20px;
          left: 20px;
        }

        .circle-2 {
          width: 50px;
          height: 50px;
          bottom: 30px;
          right: 30px;
        }

        .circle-3 {
          width: 40px;
          height: 40px;
        }
      }

      /* Loading State */
      .loading {
        opacity: 0.7;
        pointer-events: none;
      }

      .loading .submit-button {
        background: linear-gradient(
          135deg,
          var(--earthen-600),
          var(--earthen-700)
        );
      }
    </style>
  </head>
  <body>
    <div class="main-container">
      <!-- Background Image with Overlay -->
      <div class="background">
        <div class="background-overlay"></div>
      </div>

      <!-- Decorative Elements -->
      <div class="decorative-circle circle-1"></div>
      <div class="decorative-circle circle-2"></div>
      <div class="decorative-circle circle-3"></div>

      <!-- Main Content -->
      <div class="content-wrapper">
        <div class="content-container">
          <!-- Header -->
          <div class="header">
            <div class="logo-container">
              <svg class="logo-icon" fill="currentColor" viewBox="0 0 24 24">
                <path
                  d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"
                />
              </svg>
            </div>
            <h1 class="main-title">
              <span class="gradient-text">DigiCraft</span>
            </h1>
            <p class="subtitle">Buyer Portal</p>
          </div>

          <!-- Login Card -->
          <div class="login-card">
            <div class="card-header">
              <h2 class="card-title">
                <svg class="buyer-icon" fill="currentColor" viewBox="0 0 24 24">
                  <path
                    d="M17,18C15.89,18 15,18.89 15,20A2,2 0 0,0 17,22A2,2 0 0,0 19,20C19,18.89 18.1,18 17,18M1,2V4H3L6.6,11.59L5.24,14.04C5.09,14.32 5,14.65 5,15A2,2 0 0,0 7,17H19V15H7.42A0.25,0.25 0 0,1 7.17,14.75C7.17,14.7 7.18,14.66 7.2,14.63L8.1,13H15.55C16.3,13 16.96,12.58 17.3,11.97L20.88,5H5.21L4.27,2M7,18C5.89,18 5,18.89 5,20A2,2 0 0,0 7,22A2,2 0 0,0 9,20C9,18.89 8.1,18 7,18Z"
                  />
                </svg>
                Buyer Login
              </h2>
              <p class="card-description">
                Discover authentic handcrafted treasures
              </p>
            </div>

            <div class="form-container">
              <form action="BuyerLogin" method="post">
                <div class="form-group">
                  <label class="form-label" for="email">Email Address</label>
                  <input
                    type="email"
                    id="email"
                    name="email"
                    class="form-input"
                    placeholder="Enter your email address"
                    required
                  />
                </div>

                <div class="form-group">
                  <label class="form-label" for="password">Password</label>
                  <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-input"
                    placeholder="Enter your password"
                    required
                  />
                </div>

                <button type="submit" class="submit-button">
                  Start Shopping
                </button>

                <div class="register-link">
                  <a href="buyerRegister.html"> New Customer? Register Here </a>
                </div>
              </form>
            </div>
          </div>

          <!-- Back to Home Link -->
          <div class="back-link">
            <a href="index.html">← Back to Home</a>
          </div>
        </div>
      </div>
    </div>

    <script>
      // Add interactive functionality
      document.addEventListener("DOMContentLoaded", function () {
        const form = document.querySelector("form");
        const submitButton = document.querySelector(".submit-button");
        const inputs = document.querySelectorAll(".form-input");

        // Add focus animations to inputs
        inputs.forEach((input) => {
          input.addEventListener("focus", function () {
            this.parentElement.style.transform = "translateX(4px)";
          });

          input.addEventListener("blur", function () {
            this.parentElement.style.transform = "translateX(0)";
          });
        });

        // Handle form submission
        form.addEventListener("submit", function (e) {
          // Add loading state
          submitButton.textContent = "Signing In...";
          document.body.classList.add("loading");

          // You can remove this preventDefault to allow actual form submission
          // e.preventDefault();
        });

        // Add subtle animation to the buyer icon
        const buyerIcon = document.querySelector(".buyer-icon");
        setInterval(() => {
          buyerIcon.style.animation = "none";
          setTimeout(() => {
            buyerIcon.style.animation = "bounce 2s ease-in-out infinite";
          }, 100);
        }, 6000);
      });
    </script>
  </body>
</html>
